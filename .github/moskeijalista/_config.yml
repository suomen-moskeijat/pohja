# Moskeijalista suomenmoskeijat.fi (hallinta#52): rakennusajo (moskeijalista.py) kopioi tämän kansion, sivupohjan tyylit ja
# fontit sekä OHJEET.md:n väliaikaiseen kansioon ja rakentaa sen lukitulla Jekyllillä. Asetukset (url, paneeli, testi,
# turnstile_avain) tulevat versiosta tiedostoon _asetukset.yml; listan rivit tiedostoon _data/lista.json.
title: Suomen moskeijat
lang: fi
timezone: Europe/Helsinki
markdown: kramdown
kramdown:
  input: GFM
  transliterated_header_ids: true
  hard_wrap: false
exclude: [_asetukset.yml]
include: [_headers]
