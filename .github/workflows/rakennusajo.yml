# Rakennusajo (ADR-0006, ADR-0007; hallinta#41, #43): hakee sisällön yksityisestä sisältöreposta lukuavaimella, käy läpi
# sivustoluettelon ja rakentaa ja julkaisee Cloudflare Pagesiin (suora lataus) vain sivut, joiden syötteet muuttuivat
# (.github/scripts/rakennusajo.py: sisältö, sivun asetukset, sivupohja, haetut tiedot ja rakennuspäivä).
#
# Kukin haara rakentaa omat sivunsa: main-haaran ajo sivut, joiden sivupohjan versio on main, ja testi-haaran ajo
# testisivut (pohja: testi) testi-haaran sivupohjalla ja rakennusajolla. Yksi ajo kerrallaan haaraa kohden, uusi odottaa.
# Ajo ei luota käynnistyksen tietoihin vaan tunnistaa muutokset syötteistä, joten odottava ajo, jonka uudempi korvaa, ei hukkaa mitään.
#
# Käynnistys:
# - ajastus tunnin välein. GitHub ajaa ajastuksen vain main-haarasta, joten se käynnistää myös testi-haaran ajon (työ testisivut).
# - käynnistyspyyntö (workflow_dispatch): paneeli tallennuksen jälkeen, valvonta ja käsin. Syöte somet: paneelin
#   Päivitä somet nyt (moskeijan somet haetaan heti, muuten 3 tunnin välein; rukousajat joka ajossa kerran lähdettä kohden)
# - sivupohjan main- tai testi-haaran muutos: kaynnista-rakennusajo.yml (pieni työnkulku ilman salaisuuksia)
# - ei koskaan pull requestista
#
# Pohja on julkinen repo, joten:
# - avaimet (sisältörepon lukuavain, Cloudflare-avain, rakennusraportin avain, testisivujen välikerroksen avain) ovat
#   ympäristössä `julkaisu`, jonka saavat vain main- ja testi-haara
# - lokissa ei ole sisältöä eikä salaista osaa: rakennusajo peittää salaiset osat (add-mask) ja tulostaa vain sivujen nimet,
#   tulokset, syyt, kestot ja määrät; vaiheiden ja wranglerin tuloste menee tiedostoihin, joita ei tulosteta
# - ei artefakteja; välimuistissa vain julkista tietoa: gemit, pip, julkisista lähteistä haetut tiedot ja tiivisteluettelo
#   (vain tiivisteitä, ei sisältöä). Välimuistiin tallennetaan vain, kun tieto muuttui.
# Vanha julkaisu (rakenna.yml, julkaisu.yml) toimii tämän rinnalla ennallaan.
name: Rakennusajo

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      testisivut:
        description: Käynnistä myös testisivujen ajo testi-haarasta (kuten ajastus)
        type: boolean
        default: false
      somet:
        description: Sivut (nimet pilkuin), joiden somet haetaan heti (paneelin Päivitä somet nyt)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rakennusajo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Ajastus toimii vain main-haarasta: testisivujen ajo käynnistetään testi-haarasta käynnistyspyynnöllä. Ei salaisuuksia.
  testisivut:
    if: github.event_name == 'schedule' || inputs.testisivut
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Käynnistä rakennusajo testi-haarasta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rakennusajo.yml --repo "$GITHUB_REPOSITORY" --ref testi

  rakenna:
    # Kiinteä kuva: Ruby 3.3.6 (Gemfile.lock, paikalliset testit) on valmiina ubuntu-24.04:lle, ei ubuntu-26.04:lle (ubuntu-latest)
    runs-on: ubuntu-24.04
    environment: julkaisu
    timeout-minutes: 30
    env:
      VERSIO: ${{ github.ref_name }}
    steps:
      # Tämän haaran sivupohja, rakennuskomento ja rakennusajo
      - name: Hae sivupohja
        uses: actions/checkout@v4
        with:
          path: pohja
          persist-credentials: false

      # Selkeä virhe, jos lukuavain puuttuu tai ei näe sisältörepoa (ei tulosta avainta, vain tyypin ja HTTP-koodin)
      - name: Tarkista sisältörepon lukuavain
        env:
          AVAIN: ${{ secrets.SISALTO_LUKU }}
          REPO: ${{ github.repository_owner }}/sisalto
        run: |
          if [ -z "$AVAIN" ]; then
            echo "::error::SISALTO_LUKU puuttuu ympäristöstä julkaisu (tai on tallennettu muualle kuin tähän ympäristöön)"; exit 1
          fi
          case "$AVAIN" in github_pat_*) tyyppi="hienojakoinen avain";; ghp_*) tyyppi="klassinen avain";; *) tyyppi="tuntematon muoto";; esac
          koodi=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AVAIN" "https://api.github.com/repos/$REPO")
          echo "Lukuavain: $tyyppi, sisältörepo: HTTP $koodi"
          case "$koodi" in
            200) ;;
            401) echo "::error::Avain ei kelpaa (vanhentunut, poistettu tai väärin kopioitu)"; exit 1;;
            *) echo "::error::Avain ei näe sisältörepoa: tarkista Resource owner = organisaatio, repo valittuna, Contents: Read ja organisaation hyväksyntä"; exit 1;;
          esac

      - name: Hae sisältö (yksityinen sisältörepo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sisalto
          token: ${{ secrets.SISALTO_LUKU }}
          path: sisalto
          persist-credentials: false

      - name: Asenna Ruby ja lukittu Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: pohja/.github/rakennus

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pohja/.github/rakennus/requirements.txt

      # Wrangler asennetaan vasta, kun jotain julkaistaan (julkaisukohde.py): ajo ilman muutoksia ei tarvitse sitä
      - name: Asenna Python-riippuvuudet
        run: python -m pip install --quiet -r pohja/.github/rakennus/requirements.txt

      # Haetut tiedot (rukousajat, somet) julkisista lähteistä: jos haku epäonnistuu, edelliset jäävät (ADR-0004)
      - name: Palauta edelliset haetut tiedot
        uses: actions/cache/restore@v4
        with:
          path: haetut
          key: rakennusajo-haetut-v2-${{ env.VERSIO }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rakennusajo-haetut-v2-${{ env.VERSIO }}-

      # Tiivisteluettelo: viimeksi onnistuneesti julkaistujen sivujen syötteiden tiivisteet. Jos se puuttuu, kaikki rakennetaan.
      - name: Palauta tiivisteluettelo
        uses: actions/cache/restore@v4
        with:
          path: tiivisteet
          key: rakennusajo-tiivisteet-${{ env.VERSIO }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rakennusajo-tiivisteet-${{ env.VERSIO }}-

      # Haku, syötteiden tiivisteet, rakennus (rakennuskomento) ja julkaisu (julkaisukohde: Cloudflare Pages, suora lataus).
      # Yhden sivun virhe ei estä muita; ajo päättyy virheeseen, ja epäonnistunut sivu yritetään uudelleen seuraavalla ajolla.
      # Luonnoslinkki (ADR-0008, hallinta#49): luonnos, ehdotus ja testisivu salaisen polun alle, julkaistu juureen; julkaisun
      # jälkeen projektin vanhat julkaisut, joiden polku on eri (vaihdettu linkki, julkaisu), poistetaan (Cloudflare-avaimen
      # Pages-muokkausoikeus riittää). Salaiset osat peitetään lokista ennen muuta tulostetta.
      # Rakennusraportti (hallinta#47): ajon lopuksi sivujen sisältöversiot ja tulokset paneeliin omalla avaimella
      # (RAKENNUSRAPORTTI_AVAIN, sama arvo paneelin salaisuuksissa). Main-haaran ajo raportoi paneeliin, testi-haaran ajo
      # testipaneeliin (sama tietokanta). Paras yritys: jos avain puuttuu tai paneeli ei vastaa, julkaisu onnistuu silti.
      # Testisivut (hallinta#48, J8): juureen välikerroksen (_worker.js) kanssa, jonka näkee vain paneeliin kirjautunut testaaja
      # tai ylläpitäjä. Välikerros ohjaa paneelin sivulupa-reittiin ($PANEELI). Julkaisukohde asettaa välikerroksen avaimen
      # SIVULUPA_AVAIN (sama arvo paneelin salaisuuksissa) Pages-projektin salaisuudeksi ennen julkaisua (Cloudflare-avaimen
      # Pages-muokkausoikeus riittää). Ilman avainta testisivua ei julkaista, ja vanha julkaisu jää.
      # Sivun osoite (hallinta#50): julkaistu sivu rakennetaan osoitteeseen <nimi>.suomenmoskeijat.fi (tai sivustoluettelon
      # omaan verkkotunnukseen), ja ajo lisää osoitteen <nimi>.suomenmoskeijat.fi sivun Pages-projektiin, jos se puuttuu
      # (Pages: Edit). Pagesin rajapinta ei luo DNS-tietuetta, joten ajo luo CNAME-tietueen suomenmoskeijat.fi-alueelle:
      # avaimeen lisäksi Zone → DNS → Edit ja Zone → Zone → Read alueelle suomenmoskeijat.fi. Ilman niitä sivu julkaistaan
      # silti projektin omaan osoitteeseen, ja lokiin tulee varoitus.
      # Moskeijalista (hallinta#52): ajon lopuksi sivustoluettelosta suomenmoskeijat.fi:n lista omaan Pages-projektiinsa
      # (main: sm-moskeijalista, testi-haara: testiversio sm-moskeijalista-testi), kun lista tai ohjeet muuttuivat. Luonnokset vain
      # niminä, ei salaista osaa. suomenmoskeijat.fi ja www liitetään projektiin Cloudflaressa käsin (ei tässä ajossa).
      - name: Rakenna ja julkaise muuttuneet sivut
        id: ajo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAKENNUSRAPORTTI_AVAIN: ${{ secrets.RAKENNUSRAPORTTI_AVAIN }}
          SIVULUPA_AVAIN: ${{ secrets.SIVULUPA_AVAIN }}
          PANEELI: ${{ github.ref_name == 'main' && 'https://hallinta.suomenmoskeijat.fi' || 'https://hallinta-testi.suomenmoskeijat.fi' }}
          # Käynnistyksen somepyyntö ympäristömuuttujana (ei suoraan komentoon); rakennusajo hyväksyy vain sivujen nimet
          SOMET_NYT: ${{ inputs.somet }}
        run: |
          python pohja/.github/scripts/rakennusajo.py --sisalto sisalto --versio "$VERSIO" \
            --haetut haetut --hae --somet-nyt "$SOMET_NYT" --luettelo tiivisteet/tiivisteet.json --kohde cloudflare \
            --lokit "$RUNNER_TEMP/lokit" --rinnakkain 4 --raportti "$PANEELI" --paneeli "$PANEELI"

      # Välimuistiin vain, kun tieto muuttui (myös epäonnistuneen ajon jälkeen: onnistuneet sivut jäävät luetteloon)
      - name: Tallenna haetut tiedot seuraavaa ajoa varten
        if: ${{ !cancelled() && steps.ajo.outputs.haetut_muuttui == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: haetut
          key: rakennusajo-haetut-v2-${{ env.VERSIO }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tallenna tiivisteluettelo
        if: ${{ !cancelled() && steps.ajo.outputs.luettelo_muuttui == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: tiivisteet
          key: rakennusajo-tiivisteet-${{ env.VERSIO }}-${{ github.run_id }}-${{ github.run_attempt }}
