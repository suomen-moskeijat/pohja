# Rakennusajo (ADR-0006, ADR-0007; J1 hallinta#41): hakee sisällön yksityisestä sisältöreposta lukuavaimella, rakentaa
# sivun rakennuskomennolla (.github/scripts/rakenna_sivu.py) ja julkaisee sen Cloudflare Pagesiin suoralla latauksella.
# J1: vain testimoskeija ja vain käsin käynnistettynä. Testisivujen kirjautumista ei vielä ole (J8), joten testisivu
# rakennetaan sivustoluettelon salaisen osan alle, ja juuressa on vain neutraali noindex-sivu.
#
# Pohja on julkinen repo, joten:
# - käynnistys vain käsin (workflow_dispatch), ei koskaan pull requestista; avaimet ovat ympäristössä `julkaisu`,
#   jonka saavat vain main- ja testi-haara
# - lokissa ei ole sisältöä eikä salaista osaa: salainen osa peitetään (add-mask), rakennuskomento tulostaa vain kestot ja
#   määrät, ja vaiheiden sekä wranglerin tuloste menee tiedostoon, jota ei tulosteta
# - ei artefakteja; välimuistissa vain julkista tietoa (gemit, pip, haetut tiedot julkisista lähteistä)
# Vanha julkaisu (rakenna.yml, julkaisu.yml) toimii tämän rinnalla ennallaan.
name: Rakennusajo

on:
  workflow_dispatch:
    inputs:
      julkaisuja:
        description: Montako julkaisua samaan projektiin (mittaus, 1–30)
        default: "1"

permissions:
  contents: read

concurrency:
  group: rakennusajo
  cancel-in-progress: false

jobs:
  rakenna:
    # Kiinteä kuva: Ruby 3.3.6 (Gemfile.lock, paikalliset testit) on valmiina ubuntu-24.04:lle, ei ubuntu-26.04:lle (ubuntu-latest)
    runs-on: ubuntu-24.04
    environment: julkaisu
    timeout-minutes: 30
    env:
      SIVU: testimoskeija
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Hae sivupohja
        uses: actions/checkout@v4
        with:
          path: pohja
          persist-credentials: false

      - name: Hae sisältö (yksityinen sisältörepo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sisalto
          token: ${{ secrets.SISALTO_LUKU }}
          path: sisalto
          persist-credentials: false

      - name: Asenna Ruby ja lukittu Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: pohja/.github/rakennus

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pohja/.github/rakennus/requirements.txt

      - name: Asenna Python-riippuvuudet ja wrangler
        run: |
          python -m pip install --quiet -r pohja/.github/rakennus/requirements.txt
          npm install --global --silent wrangler@4.158.0 > /dev/null
          echo "wrangler $(wrangler --version 2>/dev/null | tail -1)"

      # Salainen osa peitetään ennen kuin mikään vaihe voi tulostaa sitä. Asetukset tiedostoon, ei ympäristömuuttujiin.
      - name: Lue sivun asetukset sivustoluettelosta
        id: sivu
        run: |
          python - <<'PY'
          import json, os, re, sys
          import yaml
          try:
              d = yaml.safe_load(open("sisalto/sivustot.yml", encoding="utf-8"))
              s = next(x for x in d["sivut"] if x.get("nimi") == os.environ["SIVU"])
          except Exception:
              sys.exit("Sivustoluetteloa (sivustot.yml) ei voitu lukea, tai siitä puuttuu sivu")
          salainen = str(s.get("salainen_osa") or "")
          if salainen:
              print(f"::add-mask::{salainen}")
              if not re.fullmatch(r"[A-Za-z0-9_-]{22,}", salainen):
                  sys.exit("salainen_osa: vähintään 22 merkkiä A-Z, a-z, 0-9, - tai _ (128 bittiä)")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,57}", str(s.get("projekti") or "")):
              sys.exit("projekti: Cloudflare Pages -projektin nimi puuttuu tai on huono")
          json.dump(s, open(os.path.join(os.environ["RUNNER_TEMP"], "sivu.json"), "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"projekti={s['projekti']}\n")
          print(f"Sivu: {s['nimi']}, projekti {s['projekti']}, pohja {s.get('pohja', 'main')}, testisivu {bool(s.get('testisivu'))}")
          PY

      # Projekti luodaan, jos sitä ei ole (suora lataus, tuotantohaara main). Git-yhteydellistä projektia ei käytetä.
      - name: Varmista Cloudflare Pages -projekti
        id: projekti
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJEKTI: ${{ steps.sivu.outputs.projekti }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN (salaisuus) tai CLOUDFLARE_ACCOUNT_ID (muuttuja) puuttuu ympäristöstä julkaisu"; exit 1
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          koodi=$(curl -s -o "$RUNNER_TEMP/p.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJEKTI")
          if [ "$koodi" = "404" ]; then
            koodi=$(curl -s -o "$RUNNER_TEMP/p.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" "$api" -d "{\"name\":\"$PROJEKTI\",\"production_branch\":\"main\"}")
            echo "Projekti luotu ($koodi)"
          fi
          if [ "$koodi" != "200" ]; then
            echo "::error::Projektia ei voitu lukea tai luoda ($koodi): $(jq -c '[.errors[]? | {code, message}]' "$RUNNER_TEMP/p.json")"; exit 1
          fi
          if [ "$(jq -r '.result.source // empty | .type' "$RUNNER_TEMP/p.json")" != "" ]; then
            echo "::error::Projekti on kytketty Git-repoon; rakennusajo julkaisee vain suoralla latauksella"; exit 1
          fi
          echo "osoite=https://$(jq -r '.result.subdomain' "$RUNNER_TEMP/p.json")" >> "$GITHUB_OUTPUT"
          echo "Projekti: $PROJEKTI ($(jq -r '.result.subdomain' "$RUNNER_TEMP/p.json"), tuotantohaara $(jq -r '.result.production_branch' "$RUNNER_TEMP/p.json"))"

      # Haetut tiedot (rukousajat, somet) julkisista lähteistä: jos haku epäonnistuu, edelliset jäävät (ADR-0004)
      - name: Palauta edelliset haetut tiedot
        uses: actions/cache/restore@v4
        with:
          path: haetut
          key: rakennusajo-haetut-${{ env.SIVU }}-${{ github.run_id }}
          restore-keys: rakennusajo-haetut-${{ env.SIVU }}-

      - name: Rakenna sivu (rakennuskomento)
        env:
          OSOITE: ${{ steps.projekti.outputs.osoite }}
        run: |
          s="$RUNNER_TEMP/sivu.json"
          url=$(jq -r '.osoite // ""' "$s"); [ -n "$url" ] || url="$OSOITE"
          salainen=$(jq -r '.salainen_osa // ""' "$s")
          testisivu=$(jq -r 'if .testisivu then "--testisivu" else "" end' "$s")
          python pohja/.github/scripts/rakenna_sivu.py --sisalto "sisalto/moskeijat/$SIVU" --ulos valmis \
            --url "$url" ${salainen:+--baseurl "/$salainen"} --nimi "$SIVU" $testisivu \
            --haetut haetut --hae --loki "$RUNNER_TEMP/rakennus.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tallenna haetut tiedot seuraavaa ajoa varten
        uses: actions/cache/save@v4
        with:
          path: haetut
          key: rakennusajo-haetut-${{ env.SIVU }}-${{ github.run_id }}

      # Suora lataus (wrangler pages deploy). Tuloste tiedostoon: julkiseen lokiin vain tulos, kesto ja ladattujen määrä.
      - name: Julkaise Cloudflare Pagesiin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJEKTI: ${{ steps.sivu.outputs.projekti }}
          JULKAISUJA: ${{ inputs.julkaisuja }}
        run: |
          n="${JULKAISUJA:-1}"
          case "$n" in ''|*[!0-9]*) echo "::error::julkaisuja: anna luku 1–30"; exit 1;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 30 ] || { echo "::error::julkaisuja: anna luku 1–30"; exit 1; }
          cd "$RUNNER_TEMP"
          for i in $(seq 1 "$n"); do
            t0=$(date +%s.%N)
            if wrangler pages deploy "$GITHUB_WORKSPACE/valmis" --project-name "$PROJEKTI" --branch main \
                 --commit-dirty=true --commit-message "Rakennusajo $GITHUB_RUN_ID ($i/$n)" > julkaisu.log 2>&1; then
              ladattu=$(grep -oE 'Uploaded [0-9]+ files( \([0-9]+ already uploaded\))?' julkaisu.log | tail -1 || true)
              rivi="Julkaisu $i/$n: onnistui, $(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }') s, ${ladattu:-ei ladattavaa}"
              echo "$rivi"; echo "$rivi" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Julkaisu $i/$n epäonnistui $(grep -oE '\[code: [0-9]+\]' julkaisu.log | sort -u | tr '\n' ' ')"; exit 1
            fi
          done

      # Todennus (J1): sivu avautuu ja otsakkeet ovat oikein. Polkuja ei tulosteta, vain niiden nimet.
      - name: Tarkista sivu ja otsakkeet
        env:
          OSOITE: ${{ steps.projekti.outputs.osoite }}
        run: |
          s="$RUNNER_TEMP/sivu.json"
          salainen=$(jq -r '.salainen_osa // ""' "$s"); p="${salainen:+/$salainen}"
          tarkista() { # nimi polku: tulostaa HTTP-koodin, vastaus ja otsakkeet tiedostoihin
            rm -f "$RUNNER_TEMP/vastaus" "$RUNNER_TEMP/otsakkeet"; touch "$RUNNER_TEMP/vastaus" "$RUNNER_TEMP/otsakkeet"
            curl -s -o "$RUNNER_TEMP/vastaus" -D "$RUNNER_TEMP/otsakkeet" -w '%{http_code}' "$OSOITE$2" 2>/dev/null || true
          }
          for yritys in $(seq 1 30); do koodi=$(tarkista etusivu "$p/"); [ "$koodi" = "200" ] && break; sleep 10; done
          virheita=0
          for kohta in "juuri|/" "etusivu|$p/" "kalenteri|$p/kalenteri/rukous.ics" "olematon|$p/olematon-sivu/" "juuren olematon|/olematon-sivu/"; do
            nimi="${kohta%%|*}"; polku="${kohta#*|}"
            koodi=$(tarkista "$nimi" "$polku")
            echo "$nimi: $koodi; $(grep -iE '^(x-robots-tag|referrer-policy|content-type):' "$RUNNER_TEMP/otsakkeet" | tr -d '\r' | tr '\n' ';')"
            grep -qi '^x-robots-tag: .*noindex' "$RUNNER_TEMP/otsakkeet" || { echo "::error::$nimi: X-Robots-Tag noindex puuttuu"; virheita=1; }
            grep -qi '^referrer-policy: no-referrer' "$RUNNER_TEMP/otsakkeet" || { echo "::error::$nimi: Referrer-Policy puuttuu"; virheita=1; }
          done
          tarkista etusivu "$p/" > /dev/null
          if grep -qi "<title>[^<]*$(jq -r .nimi "$s" | sed 's/-/ /g')" "$RUNNER_TEMP/vastaus"; then echo "Etusivulla on moskeijan sivu"; else echo "::error::Etusivulla ei ole moskeijan sivua"; virheita=1; fi
          tarkista juuri "/" > /dev/null
          if [ -n "$salainen" ] && grep -q -- "$salainen" "$RUNNER_TEMP/vastaus"; then echo "::error::Juuren sivu paljastaa salaisen osan"; virheita=1; else echo "Juuressa ei ole linkkiä sivulle"; fi
          exit $virheita

      # Todennus (J1, ADR-0007): julkaisujen määrä ja laukaisija (suora lataus = ad_hoc), projektien määrä tilillä
      - name: Julkaisut ja projektit Cloudflaren rajapinnasta
        if: always() && steps.projekti.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJEKTI: ${{ steps.sivu.outputs.projekti }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJEKTI/deployments?per_page=25" > "$RUNNER_TEMP/j.json"
          jq -r '"Julkaisuja projektissa: \(.result_info.total_count // (.result | length))",
                 "Viimeisimmät \(.result | length): " + ([.result[] | "\(.deployment_trigger.type)/\(.environment)/build:\(([.stages[]? | select(.name == "build") | .status] | first) // "-")"] | group_by(.) | map("\(.[0]) ×\(length)") | join(", ")),
                 "Ohitettuja: \([.result[] | select(.is_skipped)] | length)"' "$RUNNER_TEMP/j.json" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=10" \
            | jq -r '"Pages-projekteja tilillä: \(.result_info.total_count // (.result | length)) (raja 100)"' | tee -a "$GITHUB_STEP_SUMMARY"
