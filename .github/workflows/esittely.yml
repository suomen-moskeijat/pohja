# Esittelysivu: https://suomen-moskeijat.github.io/pohja/
# Julkaisee tämän repon Pagesiin moskeijahakemiston (kaikki sivut ja niiden tila) ja ohjeet (OHJEET.md).
# Esimerkkisivuna toimii oma repo suomen-moskeijat/testimoskeija. Ei näy hakukoneissa.
name: Esittelysivu

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rakenna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Kokoa ohjeet (OHJEET.md)
        run: |
          mkdir -p koottu/ohjeet && cp -r esittely/ohjeet/. koottu/ohjeet/
          printf -- '---\n---\n' > koottu/ohjeet/index.md && cat OHJEET.md >> koottu/ohjeet/index.md

      - name: Rakenna ohjeet
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./koottu/ohjeet
          destination: ./_site/ohjeet

      - name: Etusivu (kaikki moskeijat ja niiden tila)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: python3 .github/scripts/hakemisto.py index.html && sudo cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3

  julkaise:
    needs: rakenna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4
