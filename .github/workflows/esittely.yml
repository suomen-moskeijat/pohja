# Esittelysivu: https://suomen-moskeijat.github.io/pohja/
# Kokoaa kansion esittely/ esimerkkimoskeijat pohjan kanssa (kuten moskeijoiden oma
# julkaisuajo) ja julkaisee ne tämän repon Pagesiin. Ei näy hakukoneissa.
name: Esittelysivu

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rakenna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kokoa esimerkit ja hae tiedot
        run: |
          for nimi in masjid-sunnah hyvinkaa; do
            d=koottu/$nimi; mkdir -p $d
            tar --exclude=.git --exclude=.github/workflows --exclude=malli --exclude=testi --exclude=esittely --exclude=koottu -cf - . | (cd $d && tar -xf -)
            (cd esittely/$nimi && tar -cf - .) | (cd $d && tar -xf -)
            cat _config.yml esittely/$nimi/_config.yml > $d/_config.yml
            printf '\nbaseurl: "/pohja/%s"\nnoindex: true\n' "$nimi" >> $d/_config.yml
            python3 $d/.github/scripts/artikkelit.py --karsi $d
            (cd $d && python3 .github/scripts/instagram.py; python3 .github/scripts/rukousajat.py; python3 .github/scripts/somet.py) || true
          done

      # Vertailukopio: Hyvinkään oikeat tiedot + kokeiltavat ulkoasuasetukset (suorat kulmat, kevyempi varjo).
      # Verrataan oikeaan sivuun: https://suomen-moskeijat.github.io/hyvinkaa-islam-keskus/
      - name: Hae Hyvinkään tiedot vertailua varten
        uses: actions/checkout@v4
        with:
          repository: suomen-moskeijat/hyvinkaa-islam-keskus
          path: vertailu/hyvinkaa

      - name: Kokoa vertailukopio (hyvinkaa-uusi)
        run: |
          d=koottu/hyvinkaa-uusi; mkdir -p $d
          tar --exclude=.git --exclude=.github/workflows --exclude=malli --exclude=testi --exclude=esittely --exclude=koottu --exclude=vertailu -cf - . | (cd $d && tar -xf -)
          (cd vertailu/hyvinkaa && tar --exclude=.git --exclude=.github --exclude=_config.yml -cf - .) | (cd $d && tar -xf -)
          cat _config.yml vertailu/hyvinkaa/_config.yml > $d/_config.yml
          printf '\nbaseurl: "/pohja/hyvinkaa-uusi"\nnoindex: true\n' >> $d/_config.yml
          sed -i 's/^teema:.*/teema:\n  kulmat: suora\n  varjo: kevyt/' $d/_moskeijat/*.md
          python3 $d/.github/scripts/artikkelit.py --karsi $d
          (cd $d && python3 .github/scripts/instagram.py; python3 .github/scripts/rukousajat.py; python3 .github/scripts/somet.py) || true

      - uses: actions/configure-pages@v5

      - name: Kokoa ohjeet (OHJEET.md)
        run: |
          mkdir -p koottu/ohjeet && cp -r esittely/ohjeet/. koottu/ohjeet/
          printf -- '---\n---\n' > koottu/ohjeet/index.md && cat OHJEET.md >> koottu/ohjeet/index.md

      - name: Rakenna ohjeet
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./koottu/ohjeet
          destination: ./_site/ohjeet

      - name: Rakenna Masjid Sunnah
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./koottu/masjid-sunnah
          destination: ./_site/masjid-sunnah
          future: true

      - name: Rakenna Hyvinkää
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./koottu/hyvinkaa
          destination: ./_site/hyvinkaa
          future: true

      - name: Rakenna Hyvinkään vertailukopio
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./koottu/hyvinkaa-uusi
          destination: ./_site/hyvinkaa-uusi
          future: true

      - name: Etusivu (kaikki moskeijat ja niiden tila)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: python3 .github/scripts/hakemisto.py index.html && sudo cp index.html _site/index.html

      - name: Hallintapaneelin malli
        run: sudo mkdir -p _site/hallinta && sudo cp esittely/hallinta/index.html _site/hallinta/index.html

      - uses: actions/upload-pages-artifact@v3

  julkaise:
    needs: rakenna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4
