# Lisää uusi moskeija sisältörepoon (hallinta#51, ADR-0006): paneeli (Ylläpito → Uusi moskeija) käynnistää tämän, tai
# Actions → "Lisää moskeija" → Run workflow. Hakee tiedot (Mawaqit / Masjidbox / osoite / nykyinen nettisivu) ja kirjoittaa
# moskeijan kansion moskeijat/<nimi>/ ja sivustoluettelon rivin (luonnoslinkki) yksityiseen sisältörepoon yhtenä committina.
# Uusia moskeijarepoja ei luoda: sivu rakentuu rakennusajossa omaan Pages-projektiinsa (julkaisukohde luo projektin).
#
# Pohja on julkinen repo, joten:
# - syötteet luetaan käynnistyksen tiedoista (GITHUB_EVENT_PATH), ei ympäristömuuttujista (loki näyttää vaiheen ympäristön)
# - loki ei tulosta tuotua sisältöä eikä salaista osaa, vain sivun tunnuksen ja määrät
# - sisältörepon kirjoitusavain (SISALTO_KIRJOITUS) on ympäristössä julkaisu, jonka saavat vain main- ja testi-haara
# Kuivaharjoitus (kuiva): kaikki muu paitsi tallennus sisältörepoon ja rakennusajon käynnistys (testipaneeli käyttää tätä).
name: Lisää moskeija

on:
  workflow_dispatch:
    inputs:
      nimi:
        description: "Moskeijan nimi (voi jättää tyhjäksi, jos Mawaqit, Masjidbox tai nettisivu on annettu)"
        required: false
      kaupunki:
        description: "Kaupunki (voi jättää tyhjäksi, jos nettisivulla on osoite)"
        required: false
      mawaqit:
        description: "Mawaqit-linkki tai upotuskoodi (valinnainen)"
        required: false
      masjidbox:
        description: "Masjidbox-linkki (valinnainen)"
        required: false
      osoite:
        description: "Katuosoite, esim. Kauppakatu 1, 05800 Hyvinkää (valinnainen)"
        required: false
      instagram:
        description: "Instagram-linkki (valinnainen)"
        required: false
      whatsapp:
        description: "WhatsApp-numero (valinnainen)"
        required: false
      youtube:
        description: "YouTube-kanava, esim. https://www.youtube.com/@kanava (valinnainen)"
        required: false
      telegram:
        description: "Telegram-kanava, esim. https://t.me/kanava (valinnainen)"
        required: false
      repo:
        description: "Sivun tunnus (valinnainen; oletus nimestä): pienet kirjaimet, numerot ja viiva"
        required: false
      nettisivu:
        description: "Moskeijan nykyinen nettisivu (valinnainen). Sieltä haetaan logo, värit, yhteystiedot, somet, kuvat, Meistä-teksti ja sivut."
        required: false
      kuiva:
        description: "Kuivaharjoitus: ei tallenneta sisältörepoon"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # rakennusajon käynnistys tallennuksen jälkeen

jobs:
  lisaa:
    runs-on: ubuntu-24.04
    environment: julkaisu
    timeout-minutes: 20
    steps:
      - name: Hae sivupohja
        uses: actions/checkout@v4
        with:
          path: pohja
          persist-credentials: false

      - name: Hae sisältö (yksityinen sisältörepo, kirjoitusavain)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sisalto
          token: ${{ secrets.SISALTO_KIRJOITUS }}
          path: sisalto

      - name: Asenna Python-riippuvuudet (kuvankäsittely, YAML)
        run: python3 -m pip install --quiet -r pohja/.github/rakennus/requirements.txt

      - name: Lisää moskeija sisältörepoon
        env:
          ORG: ${{ github.repository_owner }}
          KUIVA: ${{ inputs.kuiva }}
        run: |
          if [ "$KUIVA" = "true" ]; then tallenna=""; else tallenna="--tallenna"; fi
          python3 pohja/.github/scripts/lisaa_moskeija.py --sisalto sisalto $tallenna

      # Uusi sivu on main-version sivu: main-haaran rakennusajo rakentaa sen heti (muuten seuraavassa ajastetussa ajossa)
      - name: Käynnistä rakennusajo
        if: ${{ !inputs.kuiva }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rakennusajo.yml --repo "$GITHUB_REPOSITORY" --ref main
