# Lisää uusi moskeija: Actions → "Lisää moskeija" → Run workflow → täytä lomake.
# Luo moskeijalle repon mallista, hakee tiedot (Mawaqit / Masjidbox / osoite)
# ja julkaisee sivun. Vaatii salaisuuden MOSKEIJA_AVAIN (ks. README).
name: Lisää moskeija

on:
  workflow_dispatch:
    inputs:
      nimi:
        description: "Moskeijan nimi (voi jättää tyhjäksi, jos Mawaqit, Masjidbox tai nettisivu on annettu)"
        required: false
      kaupunki:
        description: "Kaupunki (voi jättää tyhjäksi, jos nettisivulla on osoite)"
        required: false
      mawaqit:
        description: "Mawaqit-linkki tai upotuskoodi (valinnainen)"
        required: false
      masjidbox:
        description: "Masjidbox-linkki (valinnainen)"
        required: false
      osoite:
        description: "Katuosoite, esim. Kauppakatu 1, 05800 Hyvinkää (valinnainen)"
        required: false
      instagram:
        description: "Instagram-linkki (valinnainen)"
        required: false
      whatsapp:
        description: "WhatsApp-numero (valinnainen)"
        required: false
      youtube:
        description: "YouTube-kanava, esim. https://www.youtube.com/@kanava (valinnainen)"
        required: false
      telegram:
        description: "Telegram-kanava, esim. https://t.me/kanava (valinnainen)"
        required: false
      repo:
        description: "Repon nimi (valinnainen; oletus nimestä)"
        required: false
      nettisivu:
        description: "Moskeijan nykyinen nettisivu (valinnainen). Sieltä haetaan logo, värit, yhteystiedot, somet, kuvat, Meistä-teksti ja sivut."
        required: false
      muokkaajat:
        description: "Muokkaajien GitHub-tunnukset pilkulla eroteltuina (valinnainen). He saavat oikeuden vain tämän moskeijan sivuun."
        required: false

jobs:
  lisaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kuvankäsittely (logon värit, kuvien pienennys)
        run: pip install --quiet pillow || true
      - name: Luo moskeijan sivu
        env:
          MOSKEIJA_AVAIN: ${{ secrets.MOSKEIJA_AVAIN }}
          ORG: ${{ github.repository_owner }}
          SYOTE_NIMI: ${{ inputs.nimi }}
          SYOTE_KAUPUNKI: ${{ inputs.kaupunki }}
          SYOTE_MAWAQIT: ${{ inputs.mawaqit }}
          SYOTE_MASJIDBOX: ${{ inputs.masjidbox }}
          SYOTE_OSOITE: ${{ inputs.osoite }}
          SYOTE_INSTAGRAM: ${{ inputs.instagram }}
          SYOTE_WHATSAPP: ${{ inputs.whatsapp }}
          SYOTE_YOUTUBE: ${{ inputs.youtube }}
          SYOTE_TELEGRAM: ${{ inputs.telegram }}
          SYOTE_REPO: ${{ inputs.repo }}
          SYOTE_MUOKKAAJAT: ${{ inputs.muokkaajat }}
          SYOTE_NETTISIVU: ${{ inputs.nettisivu }}
        run: python3 .github/scripts/lisaa_moskeija.py
