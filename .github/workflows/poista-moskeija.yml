# Poistaa moskeijan sivun (hallinta#51, ADR-0006). Käynnistetään paneelista (Ylläpito → moskeija → Poista) tai käsin.
# - Sisältörepon moskeija: kansio moskeijat/<nimi>/ ja sivustoluettelon rivi poistetaan yhtenä committina, ja sitten sivun
#   Cloudflare Pages -projekti (julkaisukohde). Testisivua ei poisteta.
# - Vanhan julkaisun moskeija (siirtämätön): moskeijarepo poistetaan kuten ennen (MOSKEIJA_AVAIN).
# Jos moskeija ei halua sivua (syy: ei), sisältörepon moskeijat.csv:hen merkitään tila "ei", jottei sivua luoda uudelleen.
# Kuivaharjoitus (kuiva): ei tallenneta eikä poisteta mitään (testipaneeli käyttää tätä).
name: Poista moskeija

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Poistettavan moskeijan tunnus (esim. masjid-esimerkki)"
        required: true
      syy:
        description: "ei = moskeija ei halua sivua (merkitään listaan, ei luoda uudelleen)"
        required: false
      kuiva:
        description: "Kuivaharjoitus: ei tallenneta eikä poisteta"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  poista:
    runs-on: ubuntu-24.04
    environment: julkaisu
    timeout-minutes: 15
    steps:
      - name: Hae sivupohja
        uses: actions/checkout@v4
        with:
          path: pohja
          persist-credentials: false

      - name: Hae sisältö (yksityinen sisältörepo, kirjoitusavain)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sisalto
          token: ${{ secrets.SISALTO_KIRJOITUS }}
          path: sisalto

      - name: Asenna Python-riippuvuudet (YAML)
        run: python3 -m pip install --quiet -r pohja/.github/rakennus/requirements.txt

      - name: Poista moskeija
        env:
          ORG: ${{ github.repository_owner }}
          MOSKEIJA_AVAIN: ${{ secrets.MOSKEIJA_AVAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO: ${{ inputs.repo }}
          SYY: ${{ inputs.syy }}
          KUIVA: ${{ inputs.kuiva }}
        run: |
          if [ "$KUIVA" = "true" ]; then tallenna=""; else tallenna="--tallenna"; fi
          python3 pohja/.github/scripts/poista_moskeija.py --sisalto sisalto --kohde cloudflare $tallenna
