# Testiversio: testit.json tarkistetaan, kun pohjan testi-haaraan tulee muutos. Testattavat kohdat kuitataan paneelin
# Testaus ja julkaisu -sivulla; kun kaikki on hyväksytty, paneelin Julkaise kaikille yhdistää testi-haaran main-haaraan.
# Testimoskeija (testisivu) rakentuu heti rakennusajolla: testi-haaran muutos käynnistää sen (kaynnista-rakennusajo.yml, ilman
# salaisuuksia). Vanhan testimoskeijan julkaisuajoa ei enää käynnistetä avaimella toiseen repoon (hallinta#53); vanha
# testimoskeija päivittyy omalla tunnin ajastuksellaan, kunnes se suljetaan.
name: Tarkista testit.json

on:
  push:
    branches: [testi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarkista testit.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          d = json.load(open("testit.json"))
          virheet = []
          idt = set()
          for t in d.get("testit", []):
              if not re.fullmatch(r"[a-z0-9-]{2,80}", str(t.get("id", ""))): virheet.append(f"huono id: {t.get('id')}")
              if t.get("id") in idt: virheet.append(f"sama id kahdesti: {t['id']}")
              idt.add(t.get("id"))
              if not t.get("otsikko"): virheet.append(f"{t.get('id')}: otsikko puuttuu")
              if not isinstance(t.get("versio"), int): virheet.append(f"{t.get('id')}: versio ei ole numero")
              for l in t.get("linkit", []):
                  if not str(l.get("url", "")).startswith("https://"): virheet.append(f"{t.get('id')}: linkki ei ala https://")
          if virheet: sys.exit("testit.json: " + "; ".join(virheet))
          print(len(idt), "testiä")
          PY
