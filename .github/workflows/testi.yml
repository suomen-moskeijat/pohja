# Testiversio: kun pohjan testi-haaraan tulee muutos, testimoskeija rakennetaan heti uudelleen
# (se käyttää pohjan testi-haaraa, ks. testimoskeija/.github/workflows/julkaisu.yml).
# Testattavat kohdat ovat tiedostossa testit.json, ja ne kuitataan paneelin Testaus ja julkaisu -sivulla.
# Kun kaikki on hyväksytty, paneelin Julkaise kaikille yhdistää testi-haaran main-haaraan.
name: Päivitä testimoskeija

on:
  push:
    branches: [testi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testimoskeija:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarkista testit.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          d = json.load(open("testit.json"))
          virheet = []
          idt = set()
          for t in d.get("testit", []):
              if not re.fullmatch(r"[a-z0-9-]{2,80}", str(t.get("id", ""))): virheet.append(f"huono id: {t.get('id')}")
              if t.get("id") in idt: virheet.append(f"sama id kahdesti: {t['id']}")
              idt.add(t.get("id"))
              if not t.get("otsikko"): virheet.append(f"{t.get('id')}: otsikko puuttuu")
              if not isinstance(t.get("versio"), int): virheet.append(f"{t.get('id')}: versio ei ole numero")
              for l in t.get("linkit", []):
                  if not str(l.get("url", "")).startswith("https://"): virheet.append(f"{t.get('id')}: linkki ei ala https://")
          if virheet: sys.exit("testit.json: " + "; ".join(virheet))
          print(len(idt), "testiä")
          PY
      # repository_dispatch riittää avaimelle, jolla on Contents-oikeus (MOSKEIJA_AVAIN)
      - name: Käynnistä testimoskeijan julkaisu
        env:
          MOSKEIJA_AVAIN: ${{ secrets.MOSKEIJA_AVAIN }}
        run: |
          koodi=$(curl -s -o /tmp/v.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $MOSKEIJA_AVAIN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/testimoskeija/dispatches" \
            -d '{"event_type":"pohja-testi"}')
          if [ "$koodi" != "204" ]; then
            echo "::warning::Testimoskeijan julkaisua ei voitu käynnistää ($koodi). Se päivittyy tunnin sisällä itsestään, tai paina paneelissa Päivitä testimoskeija nyt."
            cat /tmp/v.txt
          fi
