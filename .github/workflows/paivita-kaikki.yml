# Vie pohjan muokkausnäkymän (malli/.pages.yml) kaikkiin moskeijoihin, kun se muuttuu.
name: Päivitä muokkausnäkymä kaikille

on:
  push:
    branches: [main]
    paths: ["malli/.pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paivita-kaikki
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Päivitä .pages.yml kaikkiin moskeijarepoihin
        env:
          MOSKEIJA_AVAIN: ${{ secrets.MOSKEIJA_AVAIN }}
          ORG: ${{ github.repository_owner }}
        run: python3 .github/scripts/paivita_kaikki.py --tiedosto .pages.yml
