# Päivittää tai poistaa pohjan mallitiedoston kaikista moskeijarepoista (käsin: Actions → Run workflow).
name: Päivitä tiedosto kaikille

on:
  workflow_dispatch:
    inputs:
      tiedosto:
        description: "Tiedosto moskeijarepoissa (esim. .github/workflows/julkaisu.yml)"
        required: true
        default: ".pages.yml"
      poista:
        description: "Poista tiedosto repoista (muuten kopioidaan malli/<tiedosto>)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: paivita-kaikki
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Päivitä tai poista tiedosto kaikista moskeijarepoista
        env:
          MOSKEIJA_AVAIN: ${{ secrets.MOSKEIJA_AVAIN }}
          ORG: ${{ github.repository_owner }}
          TIEDOSTO: ${{ inputs.tiedosto }}
          POISTA: ${{ inputs.poista }}
        run: python3 .github/scripts/paivita_kaikki.py --tiedosto "$TIEDOSTO" $([ "$POISTA" = "true" ] && echo --poista)
