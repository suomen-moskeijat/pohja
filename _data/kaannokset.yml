tietosuojaseloste:  { fi: "Tietosuojaseloste", en: "Privacy policy", ar: "سياسة الخصوصية", so: "Ogeysiiska asturnaanta" }
tietosuoja_1:       { fi: "Käsittelemme verkkosivuston lomakkeilla lähetettyjä tietoja vain yhteydenottojen ja opetukseen ilmoittautumisen käsittelyyn.", en: "We process information sent through the website's forms only to handle enquiries and class registrations.", ar: "نعالج المعلومات المرسلة عبر نماذج الموقع فقط للرد على الاستفسارات وتسجيل الدروس.", so: "Xogta foomamka bogga loo soo diro waxaan u isticmaalnaa oo keliya ka jawaabidda xiriirada iyo diiwaangelinta waxbarashada." }
tietosuoja_2:       { fi: "Keräämme vain tarpeelliset tiedot: huoltajan nimen ja yhteystiedot sekä lapsen nimen, iän ja opetuksen tyypin. Emme pyydä arkaluonteisia tietoja.", en: "We collect only what is necessary: the guardian's name and contact details, and the child's name, age and type of education. We never ask for sensitive information.", ar: "نجمع فقط ما هو ضروري: اسم وليّ الأمر وبيانات التواصل، واسم الطفل وعمره ونوع التعليم. لا نطلب أي معلومات حساسة.", so: "Waxaan ururinnaa oo keliya xogta lagama maarmaanka ah: magaca iyo xiriirka waalidka, iyo magaca, da'da iyo nooca waxbarashada ilmaha. Ma weydiisanno xog xasaasi ah." }
tietosuoja_3:       { fi: "Lomakkeen tiedot toimitetaan moskeijalle suojattua yhteyttä pitkin joko lomakepalvelun kautta tai valmiiksi kirjoitettuna WhatsApp- tai sähköpostiviestinä, jonka lähetät itse. Sivusto ei tallenna tietoja, eikä niitä julkaista tai käytetä analytiikkaan.", en: "Form information is delivered to the mosque over a secure connection, either through a form service or as a pre-written WhatsApp or email message that you send yourself. The website does not store the information, and it is never published or used for analytics.", ar: "تُرسل معلومات النموذج إلى المسجد عبر اتصال آمن، إما من خلال خدمة نماذج أو كرسالة واتساب أو بريد إلكتروني جاهزة ترسلها بنفسك. لا يخزّن الموقع المعلومات ولا تُنشر ولا تُستخدم للتحليلات.", so: "Xogta foomka waxaa masjidka loogu gudbiyaa xiriir sugan, ha ahaato adeeg foom ama fariin WhatsApp ama iimayl oo diyaar ah oo adigu dirto. Boggu ma kaydiyo xogta, lama daabaco, looma isticmaalo falanqayn." }
tietosuoja_4:       { fi: "Voit pyytää tietojesi tarkastamista tai poistamista ottamalla yhteyttä moskeijaan.", en: "You may request access to or deletion of your information by contacting the mosque.", ar: "يمكنك طلب الاطلاع على بياناتك أو حذفها بالتواصل مع المسجد.", so: "Waxaad codsan kartaa in xogtaada la eego ama la tirtiro adigoo la xiriiraya masjidka." }
tietosuoja_5:       { fi: "Somejulkaisut ja kartta ladataan ulkopuolisista palveluista vasta, kun annat siihen luvan tai avaat ne.", en: "Social media posts and maps are loaded from external services only after you allow it or open them.", ar: "لا تُحمَّل منشورات التواصل الاجتماعي والخرائط من خدمات خارجية إلا بعد موافقتك أو فتحها.", so: "Qoraallada baraha bulshada iyo khariidadaha waxaa laga soo raraa adeegyo dibadeed kaliya marka aad ogolaato ama aad furto." }

# --- Hakemisto ---
haku_otsikko:       { fi: "Löydä moskeija läheltäsi", en: "Find a mosque near you", ar: "ابحث عن مسجد قريب منك", so: "Raadi masjid kuu dhow" }
haku_teksti:        { fi: "Rukousajat, tapahtumat ja ajankohtaiset asiat Suomen moskeijoista yhdessä paikassa – myös ilman sometiliä.", en: "Prayer times, events and news from mosques in Finland in one place – no social media account needed.", ar: "مواقيت الصلاة والفعاليات وأخبار مساجد فنلندا في مكان واحد – دون الحاجة إلى حسابات تواصل.", so: "Waqtiyada salaadda, dhacdooyinka iyo wararka masaajidda Finland hal meel – akoon baraha bulshada looma baahna." }
haku_placeholder:   { fi: "Hae kaupungilla tai nimellä, esim. Tampere", en: "Search by city or name, e.g. Tampere", ar: "ابحث بالمدينة أو الاسم، مثل تامبيري", so: "Ku raadi magaalo ama magac, tusaale Tampere" }
ei_osumia:          { fi: "Hakuehdolla ei löytynyt moskeijoita.", en: "No mosques found.", ar: "لم يتم العثور على مساجد.", so: "Masjid lama helin." }
esimerkki_huom:     { fi: "Tämä on esimerkkimoskeija, jonka tiedot ovat keksittyjä.", en: "This is an example mosque with made-up details.", ar: "هذا مسجد تجريبي ببيانات غير حقيقية.", so: "Kani waa masjid tusaale ah oo xogtiisu aysan dhab ahayn." }

