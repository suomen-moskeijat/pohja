# Tietosuojaseloste (tietosuoja.html)
ts_johdanto: { fi: "Tässä selosteessa kerrotaan, mitä henkilötietoja moskeija käsittelee tämän verkkosivuston kautta, miksi ja miten. Sivustolla ei ole analytiikkaa, mainoksia eikä seurantaevästeitä.", en: "This notice explains what personal data the mosque processes through this website, why and how. The website has no analytics, advertising or tracking cookies.", ar: "يوضح هذا الإشعار البيانات الشخصية التي يعالجها المسجد عبر هذا الموقع، ولماذا وكيف. لا يستخدم الموقع أدوات تحليل أو إعلانات أو ملفات تعريف ارتباط للتتبع.", so: "Ogeysiiskan wuxuu sharxayaa xogta shakhsiyeed ee masjidku ku maareeyo boggan, sababta iyo sida. Boggu ma laha falanqayn, xayeysiis ama cookies raadraac ah." }
ts_rekisterinpitaja: { fi: "Rekisterinpitäjä", en: "Data controller", ar: "الجهة المسؤولة عن البيانات", so: "Mas'uulka xogta" }
ts_mita_otsikko: { fi: "Mitä tietoja käsittelemme ja miksi", en: "What data we process and why", ar: "البيانات التي نعالجها ولماذا", so: "Xogta aan maareyno iyo sababta" }
ts_yhteydenotot: { fi: "Yhteydenotot (Kysy moskeijalta -lomake): nimesi, yhteystietosi ja viestisi. Käytämme niitä vain kysymykseesi vastaamiseen. Käsittelyn peruste on oma pyyntösi.", en: "Enquiries (Ask the mosque form): your name, contact details and message. We use them only to answer your question. The legal basis is your own request.", ar: "الاستفسارات (نموذج اسأل المسجد): اسمك وبيانات الاتصال بك ورسالتك. نستخدمها فقط للرد على سؤالك. أساس المعالجة هو طلبك أنت.", so: "Su'aalaha (foomka Weydii masjidka): magacaaga, xiriirkaaga iyo fariintaada. Waxaan u isticmaalnaa oo keliya ka jawaabidda su'aashaada. Saldhigga sharciga ah waa codsigaaga." }
ts_ilmoittautumiset: { fi: "Ilmoittautuminen lasten opetukseen: huoltajan nimi ja yhteystiedot sekä lapsen nimi, ikä ja opetuksen tyyppi. Käytämme niitä opetuksen järjestämiseen ja yhteydenpitoon huoltajan kanssa. Käsittelyn peruste on huoltajan pyyntö ja suostumus.", en: "Registration for children's classes: the guardian's name and contact details and the child's name, age and type of class. We use them to organise the classes and to stay in touch with the guardian. The legal basis is the guardian's request and consent.", ar: "التسجيل في دروس الأطفال: اسم ولي الأمر وبيانات الاتصال به، واسم الطفل وعمره ونوع الدرس. نستخدمها لتنظيم الدروس والتواصل مع ولي الأمر. أساس المعالجة هو طلب ولي الأمر وموافقته.", so: "Diiwaangelinta waxbarashada carruurta: magaca iyo xiriirka waalidka, iyo magaca, da'da iyo nooca waxbarashada ilmaha. Waxaan u isticmaalnaa abaabulka waxbarashada iyo la xiriirka waalidka. Saldhigga sharciga ah waa codsiga iyo ogolaanshaha waalidka." }
ts_vakaumus: { fi: "Ilmoittautuminen moskeijan toimintaan voi kertoa perheen uskonnollisesta vakaumuksesta. Käsittelemme tietoja vain moskeijan omassa toiminnassa emmekä luovuta niitä ulkopuolisille.", en: "Registering for the mosque's activities may reveal a family's religious beliefs. We process the data only within the mosque's own activities and do not disclose it to third parties.", ar: "قد يكشف التسجيل في أنشطة المسجد عن المعتقد الديني للأسرة. نعالج البيانات فقط ضمن أنشطة المسجد ولا نشاركها مع أي جهة خارجية.", so: "Is-diiwaangelinta hawlaha masjidka waxay muujin kartaa caqiidada diineed ee qoyska. Xogta waxaan ku maareynaa oo keliya hawlaha masjidka, lamana wadaagno dad kale." }
ts_kulku_otsikko: { fi: "Miten tiedot kulkevat", en: "How the data is delivered", ar: "كيف تُرسل البيانات", so: "Sida xogta loo gudbiyo" }
ts_kulku: { fi: "Lomakkeen tiedot toimitetaan moskeijalle joko sähköpostina lomakepalvelun kautta tai valmiiksi kirjoitettuna WhatsApp- tai sähköpostiviestinä, jonka lähetät itse. Lomakepalvelu ei tallenna viestien sisältöä, vaan välittää ne moskeijan sähköpostiin. Kun viesti lähtee sähköpostina, lähettäjä saa automaattisen kuittauksen.", en: "Form data is delivered to the mosque either by email through the form service, or as a pre-written WhatsApp or email message that you send yourself. The form service does not store the content of messages; it forwards them to the mosque's email. When delivered by email, the sender receives an automatic confirmation.", ar: "تُرسل بيانات النموذج إلى المسجد إما بالبريد الإلكتروني عبر خدمة النماذج، أو كرسالة واتساب أو بريد إلكتروني جاهزة ترسلها أنت بنفسك. لا تحفظ خدمة النماذج محتوى الرسائل، بل تحولها إلى بريد المسجد. وعند الإرسال بالبريد يتلقى المرسل تأكيداً تلقائياً.", so: "Xogta foomka waxaa masjidka loogu gudbiyaa iimayl ahaan iyadoo loo marayo adeegga foomamka, ama fariin WhatsApp ama iimayl oo diyaarsan oo adigu dirto. Adeegga foomamku ma kaydiyo waxa ku jira fariimaha, wuxuu u gudbiyaa iimaylka masjidka. Marka iimayl lagu diro, diruhu wuxuu helayaa xaqiijin toos ah." }
ts_palvelut: { fi: "Käytetyt palvelut: verkkosivusto toimii GitHub Pages -palvelussa (GitHub Inc.), lomakepalvelu Cloudflaressa (Cloudflare Inc.) ja sähköpostit lähtevät Brevon kautta (Sendinblue SAS, EU). WhatsApp-viestit kulkevat Meta Platformsin kautta, jos valitset WhatsAppin. Yhdysvaltalaiset palvelut ovat sitoutuneet EU:n ja Yhdysvaltojen tietosuojakehykseen (Data Privacy Framework).", en: "Services used: the website runs on GitHub Pages (GitHub Inc.), the form service on Cloudflare (Cloudflare Inc.), and emails are sent via Brevo (Sendinblue SAS, EU). WhatsApp messages go through Meta Platforms if you choose WhatsApp. The US-based services are committed to the EU–US Data Privacy Framework.", ar: "الخدمات المستخدمة: يعمل الموقع على GitHub Pages (شركة GitHub)، وخدمة النماذج على Cloudflare (شركة Cloudflare)، وتُرسل الرسائل الإلكترونية عبر Brevo (شركة Sendinblue في الاتحاد الأوروبي). تمر رسائل واتساب عبر شركة Meta إذا اخترت واتساب. الخدمات الأمريكية ملتزمة بإطار خصوصية البيانات بين الاتحاد الأوروبي والولايات المتحدة.", so: "Adeegyada la isticmaalo: boggu wuxuu ku shaqeeyaa GitHub Pages (GitHub Inc.), adeegga foomamku Cloudflare (Cloudflare Inc.), iimaylladana waxaa loo diraa Brevo (Sendinblue SAS, EU). Fariimaha WhatsApp waxay maraan Meta Platforms haddii aad doorato WhatsApp. Adeegyada Maraykanku waxay u heellan yihiin Qaab-dhismeedka Asturnaanta Xogta ee EU iyo Maraykanka." }
ts_tekninen: { fi: "Roskapostin estämiseksi lomakepalvelu käsittelee lähettäjän IP-osoitetta ja voi käyttää Cloudflare Turnstile -tarkistusta. IP-osoitteet poistetaan kahden vuorokauden kuluessa. Sivuston palvelin voi kirjata kävijän IP-osoitteen tietoturvasyistä.", en: "To prevent spam, the form service processes the sender's IP address and may use a Cloudflare Turnstile check. IP addresses are deleted within two days. The website's server may log visitors' IP addresses for security reasons.", ar: "لمنع الرسائل المزعجة، تعالج خدمة النماذج عنوان IP للمرسل وقد تستخدم فحص Cloudflare Turnstile. تُحذف عناوين IP خلال يومين. قد يسجل خادم الموقع عناوين IP للزوار لأسباب أمنية.", so: "Si looga hortago fariimaha qashinka ah, adeegga foomamku wuxuu maareeyaa ciwaanka IP-ga diraha wuxuuna isticmaali karaa hubinta Cloudflare Turnstile. Ciwaannada IP-ga waa la tirtiraa labo maalmood gudahood. Server-ka boggu wuxuu diiwaangelin karaa IP-ga booqdayaasha sababo ammaan." }
ts_selain_otsikko: { fi: "Evästeet ja ulkopuoliset palvelut", en: "Cookies and external services", ar: "ملفات تعريف الارتباط والخدمات الخارجية", so: "Cookies iyo adeegyada dibadda" }
ts_selain: { fi: "Sivusto ei käytä evästeitä. Selaimesi muistaa vain valitsemasi kielen. Fontit ladataan sivuston omalta palvelimelta. Kartta (Google Maps) ja videot (YouTube) latautuvat vasta, kun painat niitä – silloin kyseinen palvelu saa IP-osoitteesi ja voi käyttää omia evästeitään.", en: "The website does not use cookies. Your browser only remembers the language you chose. Fonts are loaded from the website's own server. The map (Google Maps) and videos (YouTube) load only when you tap them – the service in question then receives your IP address and may use its own cookies.", ar: "لا يستخدم الموقع ملفات تعريف الارتباط. يتذكر متصفحك فقط اللغة التي اخترتها. تُحمَّل الخطوط من خادم الموقع نفسه. لا تُحمَّل الخريطة (خرائط Google) ومقاطع الفيديو (YouTube) إلا عند الضغط عليها، وعندها تتلقى تلك الخدمة عنوان IP الخاص بك وقد تستخدم ملفات تعريف الارتباط الخاصة بها.", so: "Boggu ma isticmaalo cookies. Browser-kaagu wuxuu xusuustaa oo keliya luqadda aad dooratay. Farta qoraalka waxaa laga soo raraa server-ka boggan. Khariidadda (Google Maps) iyo fiidiyowyada (YouTube) waxay soo baxaan oo keliya marka aad riixdo – markaas adeeggaasi wuxuu helayaa IP-gaaga wuxuuna isticmaali karaa cookies-kiisa." }
ts_sailytys_otsikko: { fi: "Säilytysaika", en: "Retention", ar: "مدة الاحتفاظ", so: "Muddada kaydinta" }
ts_sailytys: { fi: "Moskeija säilyttää viestit ja ilmoittautumiset vain niin kauan kuin asian hoitaminen tai opetukseen osallistuminen edellyttää, ja poistaa ne sen jälkeen.", en: "The mosque keeps messages and registrations only as long as needed to handle the matter or for the child's participation in classes, and deletes them afterwards.", ar: "يحتفظ المسجد بالرسائل وطلبات التسجيل فقط طوال المدة اللازمة لمعالجة الأمر أو لمشاركة الطفل في الدروس، ثم يحذفها.", so: "Masjidku wuxuu kaydiyaa fariimaha iyo diiwaangelinta oo keliya inta loo baahan yahay in arrinta la xalliyo ama ilmuhu ka qayb galo waxbarashada, kadibna waa tirtiraa." }
ts_oikeudet_otsikko: { fi: "Oikeutesi", en: "Your rights", ar: "حقوقك", so: "Xuquuqdaada" }
ts_oikeudet: { fi: "Sinulla on oikeus tarkastaa tietosi, pyytää niiden korjaamista tai poistamista sekä rajoittaa tai vastustaa niiden käsittelyä. Voit perua suostumuksesi milloin tahansa. Ota yhteyttä moskeijaan:", en: "You have the right to access your data, ask for it to be corrected or deleted, and to restrict or object to its processing. You may withdraw your consent at any time. Contact the mosque:", ar: "يحق لك الاطلاع على بياناتك وطلب تصحيحها أو حذفها، وتقييد معالجتها أو الاعتراض عليها. ويمكنك سحب موافقتك في أي وقت. تواصل مع المسجد:", so: "Waxaad xaq u leedahay inaad aragto xogtaada, codsato in la saxo ama la tirtiro, iyo inaad xaddiddo ama diiddo maareynteeda. Waxaad ka noqon kartaa ogolaanshahaaga wakhti kasta. La xiriir masjidka:" }
ts_valitus: { fi: "Jos katsot, että tietojasi käsitellään lainvastaisesti, voit tehdä valituksen tietosuojavaltuutetulle (tietosuoja.fi).", en: "If you believe your data is processed unlawfully, you can lodge a complaint with the Data Protection Ombudsman (tietosuoja.fi).", ar: "إذا كنت تعتقد أن بياناتك تُعالج بشكل غير قانوني، يمكنك تقديم شكوى إلى مفوض حماية البيانات في فنلندا (tietosuoja.fi).", so: "Haddii aad u malaynayso in xogtaada si sharci darro ah loo maareynayo, waxaad cabasho u gudbin kartaa Wakiilka Ilaalinta Xogta (tietosuoja.fi)." }
