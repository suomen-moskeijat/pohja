# Suomen moskeijat -sivupohjan perusasetukset.
# Julkaisussa tämän perään liitetään moskeijan oma _config.yml (sen arvot voittavat).
lang: fi
kielet: [fi, en, ar, so]
timezone: Europe/Helsinki
# Lomakkeiden suora sähköpostilähetys (hallintapaneelin palvelin toimittaa viestin moskeijan sähköpostiin)
lomake_api: https://hallinta.atifiwais.workers.dev/api/lomake
# Cloudflare Turnstile -ihmistarkistus lomakkeisiin (julkinen sivustoavain; salainen avain on vain paneelilla)
turnstile_avain: 0x4AAAAAAF-jQa_vQ0-UmE2o
future: true          # tapahtumat ovat tulevaisuudessa
hakemisto_url: ""

collections:
  moskeijat:
    output: false     # moskeijan tiedot, ei omaa sivua
  tapahtumat:
    output: true
    permalink: /tapahtumat/:name/
  artikkelit:
    output: true      # omat artikkelit (_artikkelit/) ja valitut yhteiset lähteet
    permalink: /artikkelit/:name/
  sivut:
    output: true      # moskeijan omat sivut (_sivut/), esim. kirjat, lähteet, artikkelit
    permalink: /:name/

defaults:
  - scope: { path: "", type: tapahtumat }
    values: { layout: tapahtuma }
  - scope: { path: "", type: artikkelit }
    values: { layout: artikkeli }
  - scope: { path: "", type: sivut }
    values: { layout: oma }

markdown: kramdown

exclude:
  - moskeijat.csv       # moskeijalista on pohjan ylläpitoa varten, ei moskeijan sivulle
  - README.md
  - OHJE.md
  - OHJEET.md
  - MUUTOKSET-JA-TESTAUS.md
  - malli
  - esittely
  - koottu
  - testi
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
